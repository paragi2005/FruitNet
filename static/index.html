<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="AI-powered fruit quality assessment using deep learning. Upload or capture fruit images to classify quality and freshness in real-time.">
    <meta name="theme-color" content="#6c5ce7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FruitNet">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="msapplication-TileColor" content="#0a0a1a">

    <title>FruitNet — AI Fruit Quality Classifier</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">

    <!-- App Icons -->
    <link rel="icon" type="image/png" sizes="512x512" href="/static/icon-512.png">
    <link rel="apple-touch-icon" sizes="192x192" href="/static/icon-192.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- PWA Install Banner -->
    <div id="install-banner" class="install-banner hidden">
        <div class="install-banner-content">
            <span class="install-icon">📲</span>
            <span class="install-text">Install FruitNet App</span>
            <button id="install-btn" class="install-btn">Install</button>
            <button id="install-dismiss" class="install-dismiss">&times;</button>
        </div>
    </div>

    <div class="app-container">
        <header class="app-header">
            <h1 class="app-title">FruitNet</h1>
            <p class="app-tagline">AI-Powered Fruit Quality Assessment</p>
        </header>

        <main class="main-content">
            <div class="glass-card">
                <div id="upload-zone" class="upload-zone">
                    <div class="upload-icon">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                    </div>
                    <p class="upload-text">Drop a fruit image here or <span class="upload-browse">click to browse</span></p>
                    <input type="file" id="file-input" accept="image/*" capture="environment" hidden>
                </div>

                <div id="preview-container" class="preview-container hidden">
                    <img id="image-preview" class="image-preview" src="" alt="Fruit preview">
                    <button id="analyze-btn" class="analyze-btn">
                        <span class="btn-text">Analyze Fruit</span>
                        <div class="spinner hidden"></div>
                    </button>
                </div>

                <div id="error-message" class="error-message hidden"></div>

                <div id="results-section" class="results-section hidden">
                    <div class="top-prediction">
                        <div class="prediction-emoji" id="prediction-emoji">🍎</div>
                        <div class="prediction-details">
                            <h2 class="prediction-title" id="prediction-title">Apple</h2>
                            <div class="prediction-quality-row">
                                <span class="quality-badge" id="quality-badge">Good</span>
                                <span class="confidence-value" id="top-confidence-val">98%</span>
                            </div>
                            <div class="confidence-bar-container large">
                                <div class="confidence-bar-fill" id="top-confidence-fill"></div>
                            </div>
                        </div>
                    </div>

                    <h3 class="top5-heading">Other Possibilities</h3>
                    <div id="top5-list" class="top5-list">
                        <!-- Top 5 predictions will be injected here -->
                    </div>
                </div>
            </div>
        </main>

        <footer class="app-footer">
            <p>Built for FruitNet AI</p>
        </footer>
    </div>

    <script src="/static/app.js"></script>
    <script>
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
                    .then((registration) => {
                        console.log('[PWA] Service Worker registered with scope:', registration.scope);
                    })
                    .catch((error) => {
                        console.warn('[PWA] Service Worker registration failed:', error);
                    });
            });
        }

        // PWA Install Prompt Handler
        let deferredPrompt;
        const installBanner = document.getElementById('install-banner');
        const installBtn = document.getElementById('install-btn');
        const installDismiss = document.getElementById('install-dismiss');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBanner.classList.remove('hidden');
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const result = await deferredPrompt.userChoice;
                console.log('[PWA] Install prompt result:', result.outcome);
                deferredPrompt = null;
                installBanner.classList.add('hidden');
            }
        });

        installDismiss.addEventListener('click', () => {
            installBanner.classList.add('hidden');
        });

        window.addEventListener('appinstalled', () => {
            console.log('[PWA] App installed successfully!');
            installBanner.classList.add('hidden');
        });
    </script>
</body>
</html>
